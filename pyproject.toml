[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdid-py"
version = "0.1.0"
description = "Synthetic Difference-in-Differences (Arkhangelsky et al. 2021): a complete Python port of the reference R package"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Atom Matsuda", email = "matsudaatom@gmail.com" }]
keywords = [
    "synthetic-difference-in-differences",
    "synthetic-control",
    "difference-in-differences",
    "causal-inference",
    "panel-data",
    "econometrics",
    "policy-evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5", "build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/tomtomtom1007/synthdid-py"
Repository = "https://github.com/tomtomtom1007/synthdid-py"
Issues = "https://github.com/tomtomtom1007/synthdid-py/issues"
"Reference implementation (R)" = "https://github.com/synth-inference/synthdid"

[tool.setuptools.packages.find]
where = ["src"]
include = ["synthdid*"]

[tool.setuptools.package-data]
synthdid = ["py.typed"]
"synthdid.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
filterwarnings = ["error::RuntimeWarning"]
